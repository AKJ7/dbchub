name: Validate databases

# Runs the `check` step of the API on every contribution. A PR that adds or
# changes a database file is parsed and linted; malformed files fail the check
# and block the merge.
on:
  pull_request:
    paths:
      - "databases/**"
      - "scripts/**"
  push:
    branches: [master]
    paths:
      - "databases/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate all databases
        run: uv run dbchub-validate --root databases
