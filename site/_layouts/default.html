<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Content Security Policy. Scripts may load only from this origin (no inline JS,
      no third-party CDNs), and the browser may connect only to GitHub's API (used by
      the upload flow). This is the main defense-in-depth against XSS.
      Note: some directives (e.g. frame-ancestors) only take effect as a real HTTP
      header — set them at your host if you need clickjacking protection.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'none';
      base-uri 'none';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data:;
      font-src 'self';
      connect-src 'self' https://api.github.com;
      form-action 'self';
    " />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ site.description | escape }}" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  </head>
  <body
    data-upstream="{{ site.upstream_repo | default: '' | escape }}"
    data-base-branch="{{ site.base_branch | default: 'master' | escape }}"
  >
    <nav class="nav">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="logo">◈</span> {{ site.title | escape }}
      </a>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" />
        </svg>
        <input id="search" type="search" placeholder="Search databases by name, manufacturer, model…" autocomplete="off" />
      </div>
      <div class="spacer"></div>
      <a class="btn" href="{{ '/legal/' | relative_url }}">Legal</a>
      <button class="btn primary" id="open-upload">↑ Upload database</button>
    </nav>

    {{ content }}

    <footer class="footer">
      dbchub · a versioned, Git-native catalog of automotive signal databases ·
      <a href="{{ '/legal/' | relative_url }}">Legal</a> ·
      <a href="{{ '/index.json' | relative_url }}">index.json</a>
    </footer>

    <!-- Catalog data as inert JSON (not executed), HTML-escaped to prevent markup
         breakout. app.js reads and JSON.parses it. -->
    <script id="dbchub-catalog" type="application/json">{{ site.data.catalog.databases | default: empty | jsonify | replace: '<', '<' | replace: '>', '>' }}</script>
    <script src="{{ '/assets/js/app.js' | relative_url }}"></script>
  </body>
</html>
